{{/*
PersistentVolumeClaim - only created if persistence.enabled is true
The {{- if }} syntax conditionally includes this entire file
*/}}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "youtube-downloader.fullname" . }}
  labels:
    {{- include "youtube-downloader.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
