<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaWizard 98</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        /* --- RETRO Y2K STYLES --- */
        body {
            background-color: #008080; /* Classic Teal */
            font-family: 'VT323', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Window Container */
        .window {
            background: #c0c0c0;
            width: 100%;
            max-width: 600px;
            box-shadow: 2px 2px 0px #000;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            display: flex;
            flex-direction: column;
        }

        /* Title Bar */
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            padding: 3px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2px;
        }

        .title-bar-text {
            color: white;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
            padding-left: 5px;
        }

        .title-bar-controls button {
            width: 20px;
            height: 20px;
            min-width: 20px;
            padding: 0;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            line-height: 10px;
            background: #c0c0c0;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            box-shadow: none;
            margin-left: 2px;
        }

        .title-bar-controls button:active {
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
        }

        /* Window Body */
        .window-body {
            padding: 16px;
            font-size: 20px;
        }

        /* Fieldsets (Group Boxes) */
        fieldset {
            border: 2px solid #808080;
            border-style: groove;
            margin-bottom: 15px;
            padding: 10px 15px;
        }

        legend {
            padding: 0 5px;
            font-size: 20px;
        }

        /* Inputs & Selects */
        .form-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            cursor: pointer;
            margin-right: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 4px 6px;
            font-family: 'VT323', monospace;
            font-size: 20px;
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #dfdfdf;
            background: white;
            box-sizing: border-box;
        }

        select {
            font-family: 'VT323', monospace;
            font-size: 18px;
            padding: 2px 5px;
            background: #fff;
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            margin-left: 10px;
        }

        /* Main Button */
        button#submitBtn {
            font-family: 'VT323', monospace;
            font-size: 24px;
            padding: 6px 20px;
            width: 100%;
            background: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 1px 1px 0px #000;
        }

        button#submitBtn:active {
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: translate(1px, 1px);
            box-shadow: none;
        }
        
        button#submitBtn:disabled {
            color: #808080;
            cursor: wait;
        }

        /* Status & Results */
        .status-bar {
            margin-top: 20px;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            padding: 5px;
            background: #c0c0c0;
            min-height: 30px;
            font-size: 18px;
        }

        .download-link {
            display: inline-block;
            margin: 5px 5px 5px 0;
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }
        .download-link:hover {
            background-color: #000080;
            color: white;
        }

        .error-msg { color: red; font-weight: bold; }
        .success-msg { color: #000080; font-weight: bold; }

        /* Progress Bar - Windows 98 Style */
        .progress-container {
            margin: 10px 0;
        }

        .progress-label {
            margin-bottom: 5px;
            font-size: 18px;
        }

        .progress-bar-outer {
            width: 100%;
            height: 20px;
            background: #fff;
            border-top: 2px solid #404040;
            border-left: 2px solid #404040;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            box-shadow: inset 1px 1px 0 #000;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #000080 0%, #000080 100%);
            background-size: 20px 20px;
            transition: width 0.3s ease;
        }

        .progress-details {
            margin-top: 5px;
            font-size: 16px;
            color: #404040;
        }

        /* Utilitites */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">MediaWizard.exe</div>
            <div class="title-bar-controls">
                <button aria-label="Minimize">_</button>
                <button aria-label="Maximize">□</button>
                <button aria-label="Close">X</button>
            </div>
        </div>
        
        <div class="window-body">
            <form id="downloadForm">
                <fieldset>
                    <legend>Source Input</legend>
                    <div class="form-row">
                        <label for="url">URL:</label>
                        <input type="text" id="url" name="url" placeholder="https://www.youtube.com/..." required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Output Settings</legend>
                    
                    <div class="form-row">
                        <input type="checkbox" id="downloadTranscript" name="downloadTranscript" checked>
                        <label for="downloadTranscript">Extract Transcript (.txt)</label>
                    </div>

                    <div class="form-row">
                        <input type="checkbox" id="downloadAudio" name="downloadAudio" checked>
                        <label for="downloadAudio">Extract Audio (.mp3)</label>
                        <select id="audioQuality" name="audioQuality">
                            <option value="128">128 kbps (Low)</option>
                            <option value="192" selected>192 kbps (CD)</option>
                            <option value="256">256 kbps (High)</option>
                            <option value="320">320 kbps (Max)</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <input type="checkbox" id="downloadVideo" name="downloadVideo">
                        <label for="downloadVideo">Extract Video (.mp4)</label>
                        <select id="videoQuality" name="videoQuality">
                            <option value="360">360p</option>
                            <option value="480">480p</option>
                            <option value="720" selected>720p (HD)</option>
                            <option value="1080">1080p (FHD)</option>
                        </select>
                    </div>
                </fieldset>

                <button type="submit" id="submitBtn">Start Download</button>
            </form>

            <div id="statusArea" class="status-bar hidden">
                <span id="statusText">Ready.</span>
                <div id="progressContainer" class="progress-container hidden">
                    <div class="progress-label" id="progressLabel">Downloading...</div>
                    <div class="progress-bar-outer">
                        <div class="progress-bar-inner" id="progressBar"></div>
                    </div>
                    <div class="progress-details" id="progressDetails">0% - Starting...</div>
                </div>
                <div id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusArea = document.getElementById('statusArea');
            const statusText = document.getElementById('statusText');
            const resultContent = document.getElementById('resultContent');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressLabel = document.getElementById('progressLabel');
            const progressDetails = document.getElementById('progressDetails');

            // Inputs
            const url = document.getElementById('url').value;
            const downloadTranscript = document.getElementById('downloadTranscript').checked;
            const downloadAudio = document.getElementById('downloadAudio').checked;
            const downloadVideo = document.getElementById('downloadVideo').checked;
            const audioQuality = document.getElementById('audioQuality').value;
            const videoQuality = document.getElementById('videoQuality').value;

            // Validation
            if (!downloadTranscript && !downloadAudio && !downloadVideo) {
                statusArea.classList.remove('hidden');
                statusText.innerHTML = '<span class="error-msg">Error: Select at least one format.</span>';
                resultContent.innerHTML = '';
                progressContainer.classList.add('hidden');
                return;
            }

            // Prepare Request
            let downloadTypes = [];
            if (downloadTranscript) downloadTypes.push('transcript');
            if (downloadAudio) downloadTypes.push('audio');
            if (downloadVideo) downloadTypes.push('video');
            const downloadType = downloadTypes.join(',');

            // UI Loading State
            statusArea.classList.remove('hidden');
            resultContent.innerHTML = '';
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressLabel.innerText = 'Starting...';
            progressDetails.innerText = 'Connecting...';
            statusText.innerText = 'Processing...';
            submitBtn.disabled = true;
            submitBtn.innerText = "Downloading...";

            try {
                const response = await fetch('/download-stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        download_type: downloadType,
                        audio_quality: downloadAudio ? audioQuality : null,
                        video_quality: downloadVideo ? videoQuality : null
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop(); // Keep incomplete chunk

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));

                            if (data.type === 'progress') {
                                const mediaLabels = {
                                    'transcript': 'Transcript',
                                    'audio': 'Audio',
                                    'video': 'Video'
                                };
                                progressLabel.innerText = `Downloading ${mediaLabels[data.media_type] || data.media_type}...`;

                                // Parse percent string to number
                                const percentNum = parseFloat(data.percent) || 0;
                                progressBar.style.width = Math.min(percentNum, 100) + '%';

                                let details = data.percent;
                                if (data.speed && data.speed !== 'N/A') details += ` - ${data.speed}`;
                                if (data.eta && data.eta !== 'N/A') details += ` - ETA: ${data.eta}`;
                                progressDetails.innerText = details;
                            } else if (data.type === 'status') {
                                progressLabel.innerText = data.message;
                                progressBar.style.width = '0%';
                                progressDetails.innerText = 'Starting...';
                            } else if (data.type === 'done') {
                                progressContainer.classList.add('hidden');
                                const results = data.results;
                                const hasFiles = results.transcript_file || results.audio_file || results.video_file;

                                if (hasFiles) {
                                    statusText.innerHTML = '<span class="success-msg">Done! Files ready:</span>';
                                    let html = '';

                                    if (results.transcript_file) {
                                        html += `<div>[TXT] <a href="/files/transcript/${encodeURIComponent(results.transcript_file)}" class="download-link" download>Download Transcript</a></div>`;
                                    }
                                    if (results.audio_file) {
                                        html += `<div>[MP3] <a href="/files/audio/${encodeURIComponent(results.audio_file)}" class="download-link" download>Download Audio (${audioQuality}kbps)</a></div>`;
                                    }
                                    if (results.video_file) {
                                        html += `<div>[MP4] <a href="/files/video/${encodeURIComponent(results.video_file)}" class="download-link" download>Download Video (${videoQuality}p)</a></div>`;
                                    }
                                    resultContent.innerHTML = html;
                                } else {
                                    statusText.innerHTML = `<span class="error-msg">Download failed: ${results.messages.join('. ')}</span>`;
                                }
                            }
                        }
                    }
                }

            } catch (error) {
                progressContainer.classList.add('hidden');
                statusText.innerHTML = `<span class="error-msg">Connection Error: ${error.message}</span>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Start Download";
            }
        });
    </script>
</body>
</html>
